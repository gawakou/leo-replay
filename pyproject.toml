[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-replay"
version = "0.2.0"
description = "Measurement-driven replay framework for LEO communication behavior"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
leo-replay = "leo_replay.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
