name: Docker bidirectional lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "labs/**"
      - "src/leo_replay/**"
      - "examples/profile-directional.example.csv"
      - ".github/workflows/docker-lab.yml"
  push:
    branches: [main]
    paths:
      - "labs/**"
      - "src/leo_replay/**"
      - "examples/profile-directional.example.csv"
      - ".github/workflows/docker-lab.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show Docker versions
        run: |
          docker version
          docker compose version
      - name: Validate Compose configuration
        run: docker compose -f labs/docker-bidirectional/compose.yaml config
      - name: Fixed-condition bidirectional test
        run: bash labs/docker-bidirectional/run-fixed-condition-test.sh
      - name: Directional profile replay test
        run: bash labs/docker-bidirectional/run-profile-test.sh
      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-bidirectional-lab
          path: labs/docker-bidirectional/artifacts/
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: bash labs/docker-bidirectional/cleanup.sh || true
